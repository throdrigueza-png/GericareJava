spring.application.name=Gericare

# --- CONFIGURACION BASE DE DATOS PARA AZURE (H2) ---
# Usamos H2 para que la app arranque en la nube sin errores de conexión
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# --- CONFIGURACION POSTGRESQL (SOLO PARA LOCAL - DESACTIVADA PARA AZURE) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/gericare
# spring.datasource.username=postgres
# spring.datasource.password=.
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.format_sql=true

# --- CONFIGURACION THYMELEAF ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
logging.level.org.thymeleaf=TRACE

# --- CONFIGURACION EMAIL (GMAIL) ---
# Para Azure, configura estas variables de entorno:
# MAIL_USERNAME: connectgericare@gmail.com
# MAIL_PASSWORD: la contraseña de aplicación de Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:connectgericare@gmail.com}
# IMPORTANTE: En Azure, debes configurar MAIL_PASSWORD como variable de entorno
# Para desarrollo local, genera tu propia contraseña de aplicación en Gmail
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${MAIL_USERNAME:connectgericare@gmail.com}
spring.mail.properties.mail.debug=true

# --- BASE URL ---
# En Azure, configura APP_BASE_URL como variable de entorno con el valor: https://gericare-web-2026.azurewebsites.net
# Para desarrollo local, usa: http://localhost:8080
app.base-url=${APP_BASE_URL:http://localhost:8080}
